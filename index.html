
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARSX — Music Archive</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #fff;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
    padding: 35px 7%;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 100px;
}

.date {
    font-size: 11px;
    letter-spacing: 2px;
    color: #777;
}

.logo {
    font-size: 35px;
    font-weight: 900;
    letter-spacing: 7px;
    animation: logoMove 4s ease-in-out infinite alternate;
}

@keyframes logoMove {
    from {
        letter-spacing: 7px;
        opacity: .65;
    }
    to {
        letter-spacing: 12px;
        opacity: 1;
    }
}

main {
    max-width: 900px;
    margin: auto;
}

.section-title {
    font-size: 12px;
    letter-spacing: 5px;
    margin-bottom: 35px;
}

.artist-card {
    display: flex;
    align-items: center;
    gap: 25px;
    padding: 25px 0;
    border-bottom: 1px solid #e8e8e8;
}

.artist-photo {
    width: 125px;
    height: 125px;
    object-fit: cover;
    background: #eee;
    flex-shrink: 0;
}

.artist-info {
    flex: 1;
    min-width: 0;
}

.artist-info h3 {
    font-size: 19px;
    margin-bottom: 9px;
}

.artist-info p {
    font-size: 10px;
    color: #888;
    letter-spacing: 2px;
    margin-bottom: 18px;
}

.view-more {
    background: transparent;
    color: #111;
    border: 1px solid #111;
    padding: 11px 23px;
    font-size: 9px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .3s;
}

.view-more:hover {
    background: #111;
    color: #fff;
}

.artist-content {
    display: none;
    padding: 25px 0 45px;
    border-bottom: 1px solid #e8e8e8;
}

.artist-content.open {
    display: block;
}

.album-heading {
    margin: 30px 0 10px;
    padding-top: 20px;
    border-top: 1px solid #eee;
}

.album-heading h3 {
    font-size: 15px;
    letter-spacing: 3px;
    margin-bottom: 7px;
}

.album-heading p {
    font-size: 10px;
    color: #888;
    letter-spacing: 2px;
}

.track {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 16px 0;
    border-bottom: 1px solid #f0f0f0;
}

.cover {
    width: 85px;
    height: 85px;
    object-fit: cover;
    background: #eee;
    flex-shrink: 0;
}

.track-info {
    flex: 1;
    min-width: 0;
}

.track-info h4 {
    font-size: 14px;
    margin-bottom: 7px;
}

.track-info p {
    font-size: 10px;
    color: #888;
    margin-bottom: 12px;
}

audio {
    width: 100%;
    max-width: 380px;
    height: 34px;
}

.about {
    border-top: 1px solid #e8e8e8;
    margin-top: 100px;
    padding-top: 40px;
    margin-bottom: 80px;
}

.about p {
    font-size: 13px;
    line-height: 2;
    color: #777;
    max-width: 550px;
}

footer {
    text-align: center;
    border-top: 1px solid #eee;
    padding-top: 30px;
    font-size: 10px;
    color: #999;
    letter-spacing: 2px;
}

footer a {
    color: #111;
    text-decoration: none;
}

@media (max-width: 600px) {
    body {
        padding: 25px 6%;
    }

    header {
        margin-bottom: 70px;
    }

    .logo {
        font-size: 27px;
    }

    .artist-card {
        gap: 15px;
    }

    .artist-photo {
        width: 95px;
        height: 95px;
    }

    .artist-info h3 {
        font-size: 15px;
    }

    .track {
        gap: 13px;
    }

    .cover {
        width: 72px;
        height: 72px;
    }

    .track-info h4 {
        font-size: 12px;
    }
}
</style>
</head>

<body>

    <p>
        ARSX is an independent music archive.

</main>

// CREATE TRACK
function createTrack(track) {

    const card = document.createElement("div");
    card.className = "track";

    const cover = document.createElement("img");
    cover.className = "cover";
    cover.src = "./assets/" + encodeURIComponent(track.cover);
    cover.alt = track.title;

    const info = document.createElement("div");
    info.className = "track-info";

    const title = document.createElement("h4");
    title.textContent = track.title;

    const artist = document.createElement("p");
    artist.textContent = track.artist;

    const audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "none";
    audio.src = "./assets/" + encodeURIComponent(track.audio);

    info.appendChild(title);
    info.appendChild(artist);
    info.appendChild(audio);

    card.appendChild(cover);
    card.appendChild(info);

    return card;
}


// CREATE ALBUM
function createAlbum(album) {

    const container = document.createElement("div");

    const heading = document.createElement("div");
    heading.className = "album-heading";

    const title = document.createElement("h3");
    title.textContent = album.title;

    const subtitle = document.createElement("p");
    subtitle.textContent = "FULL ALBUM";

    heading.appendChild(title);
    heading.appendChild(subtitle);

    container.appendChild(heading);

    album.tracks.forEach(item => {
        container.appendChild(createTrack({
            title: item[0],
            artist: item[1],
            cover: album.cover,
            audio: item[2]
        }));
    });

    return container;
}


// RENDER ARTISTS
const artistList = document.getElementById("artistList");

artists.forEach((artist, index) => {

    const card = document.createElement("div");
    card.className = "artist-card";

    const photo = document.createElement("img");
    photo.className = "artist-photo";
    photo.src = "./assets/" + encodeURIComponent(artist.photo);
    photo.alt = artist.name;

    const info = document.createElement("div");
    info.className = "artist-info";

    const name = document.createElement("h3");
    name.textContent = artist.name;

    const description = document.createElement("p");
    description.textContent = artist.description;

    const button = document.createElement("button");
    button.className = "view-more";
    button.textContent = "VIEW MORE";
    button.type = "button";

    const content = document.createElement("div");
    content.className = "artist-content";

    button.addEventListener("click", () => {

        const isOpen = content.classList.toggle("open");

        button.textContent = isOpen ? "VIEW LESS" : "VIEW MORE";
        button.setAttribute("aria-expanded", String(isOpen));

    });

    info.appendChild(name);
    info.appendChild(description);
    info.appendChild(button);

    card.appendChild(photo);
    card.appendChild(info);

    artistList.appendChild(card);

    // ARTIST SINGLES
    artist.singles.forEach(track => {
        content.appendChild(createTrack(track));
    });

    // ARTIST ALBUMS
    artist.albums.forEach(album => {
        content.appendChild(createAlbum(album));
    });

    artistList.appendChild(content);

});

</script>
